  <rect id="i-cap" x="38" y="58" width="24" height="16" rx="3"/>
  <line id="i-thread" x1="40" y1="82" x2="60" y2="82"/>
  <path id="i-filament" d="M42 34 L47 24 L53 46 L58 30"/>
</svg>
