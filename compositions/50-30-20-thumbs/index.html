<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>50-30-20 Rule — Thumbnails</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d1017;
        --ink: #f5f3ec;
        --muted: #98a2b3;
        --needs: #38bdf8;
        --wants: #f59e0b;
        --save: #22c55e;
        --warn: #ef4444;
        --pop: #ff5c39;
        --font: "Arial Black", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #000; }
      #root { font-family: var(--font); }

      .thumb {
        position: absolute; inset: 0; overflow: hidden;
        background: var(--bg); color: var(--ink);
        display: flex; align-items: center; padding: 0 60px;
      }
      .bg {
        position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center right;
        filter: grayscale(0.3) brightness(0.6) contrast(1.06);
      }
      .scrim {
        position: absolute; inset: 0; z-index: 1;
        background:
          linear-gradient(90deg, rgba(13,16,23,0.96) 0%, rgba(13,16,23,0.90) 44%, rgba(13,16,23,0.34) 78%, rgba(13,16,23,0.18) 100%),
          radial-gradient(ellipse 80% 90% at 28% 50%, var(--tint, rgba(239,68,68,0.20)), transparent 70%),
          linear-gradient(180deg, rgba(13,16,23,0.35), transparent 40%, rgba(13,16,23,0.55));
      }
      .grain {
        position: absolute; inset: 0; z-index: 1; opacity: 0.06; mix-blend-mode: overlay;
        background-image: url(assets/img/grain.png); background-size: cover;
      }
      .inner { position: relative; z-index: 2; width: 76%; }

      .tag {
        display: inline-block; font-size: 29px; font-weight: 900; letter-spacing: 3px;
        text-transform: uppercase; padding: 10px 22px; border-radius: 999px;
        background: var(--save); color: #0d1017; margin: 0 0 24px 0;
      }
      .line {
        font-size: 104px; line-height: 0.96; font-weight: 900; margin: 0; letter-spacing: -2px;
        text-shadow: 0 4px 30px rgba(0,0,0,0.85), 0 2px 6px rgba(0,0,0,0.7);
      }
      .line.red { color: var(--warn); }
      .sub {
        margin: 26px 0 0 0; font-size: 33px; font-weight: 900; letter-spacing: 1px; color: var(--ink);
        text-shadow: 0 2px 16px rgba(0,0,0,0.9);
      }
      .sub .n { color: var(--needs); }
      .sub .w { color: var(--wants); }
      .sub .s { color: var(--save); }

      /* the meter, shrunk to a thumbnail-legible strip — carries the brand across both cuts */
      .mini { position: relative; width: 100%; height: 30px; margin-top: 26px; }
      .mb { position: absolute; top: 0; height: 100%; border-radius: 7px; border: 3px solid; }
      .mb.n { left: 0;   width: 49.4%; border-color: var(--needs); background: rgba(56,189,248,0.30); }
      .mb.w { left: 50%; width: 29.4%; border-color: var(--wants); background: rgba(245,158,11,0.30); }
      .mb.s { left: 80%; width: 20%;   border-color: var(--save);  background: rgba(34,197,94,0.34); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="4"
         style="position: relative; width: 1280px; height: 720px; overflow: hidden;">

      <!-- HINDI (Roman) THUMBNAIL -->
      <section id="tHi" class="thumb clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="bg" style="background-image: url(assets/img/hi-bg.jpg)"></div>
        <div class="scrim" style="--tint: rgba(239,68,68,0.22)"></div>
        <div class="grain"></div>
        <div class="inner">
          <p class="tag">50-30-20 Rule</p>
          <!-- 92px, not the shared 104 — "SALARY AATE HI" must hold one line, no orphan -->
          <h1 class="line" style="font-size: 92px">SALARY AATE HI</h1>
          <h1 class="line red" style="font-size: 92px">KHATAM?</h1>
          <p class="sub">&#8377;30,000 ka sahi hisaab &mdash;
            <span class="n">15</span> / <span class="w">9</span> / <span class="s">6</span> hazaar</p>
          <div class="mini"><div class="mb n"></div><div class="mb w"></div><div class="mb s"></div></div>
        </div>
      </section>

      <!-- ENGLISH THUMBNAIL -->
      <section id="tEn" class="thumb clip" data-start="2" data-duration="2" data-track-index="1">
        <div class="bg" style="background-image: url(assets/img/en-bg.jpg)"></div>
        <div class="scrim" style="--tint: rgba(239,68,68,0.20)"></div>
        <div class="grain"></div>
        <div class="inner">
          <p class="tag">50/30/20 Rule</p>
          <h1 class="line">RENT EATS YOUR</h1>
          <h1 class="line red">ENTIRE 50%</h1>
          <p class="sub"><span class="warnc" style="color: var(--warn)">$1,850</span> rent vs a
            <span class="n">$2,000</span> needs budget</p>
          <div class="mini"><div class="mb n"></div><div class="mb w"></div><div class="mb s"></div></div>
        </div>
      </section>
    </div>

    <script>
      // static thumbnails — a registered empty paused timeline satisfies the runtime contract
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
