<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>S05 — 1907 · Queens of the Atlantic</title>

    <!-- GSAP (HyperFrames default animation runtime) -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      :root {
        /* === DESIGN TOKENS (mirror DESIGN.md) === */
        --paper: #0d0f12;
        --ink: #f4f1ea;
        --ink-soft: rgba(244, 241, 234, 0.82);
        --band: rgba(15, 19, 24, 0.55);
        --grade-wash: rgba(28, 40, 56, 0.18);
        --accent-warm: #c9a86a;
      }

      body {
        margin: 0;
        background: #000;
        font-family: "Playfair Display", Georgia, serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }

      .scene {
        position: absolute;
        inset: 0;
      }

      .photo-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 35%, #3a4047 0%, #23282e 55%, #15191e 100%);
      }
      .photo {
        position: absolute;
        top: -6%;
        left: -6%;
        width: 112%;
        height: 112%;            /* slight bleed so Ken Burns never shows an edge */
        object-fit: cover;
        /* Vintage grade per DESIGN.md */
        filter: grayscale(1) contrast(1.08) brightness(0.92) sepia(0.12);
        will-change: transform;
      }

      /* Blue-sepia grade wash (multiply) */
      .grade {
        position: absolute;
        inset: 0;
        background: var(--grade-wash);
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      /* TEXT BLOCK — left-aligned, vertically centered, title-safe padding */
      .text {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 0 200px;
        box-sizing: border-box;
      }
      .kicker {
        font-family: "Archivo Black", system-ui, sans-serif;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent-warm);
        margin: 0 0 30px 6px;
      }
      .year {
        font-family: "Archivo Black", system-ui, sans-serif;
        font-size: 150px;
        line-height: 1.0;
        color: var(--ink);
        margin: 0;
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
        letter-spacing: -0.01em;
      }
      .year-rule {
        width: 132px;
        height: 4px;
        background: var(--accent-warm);
        margin: 22px 0 24px 6px;
        border-radius: 2px;
      }
      .title-band {
        display: inline-block;
        background: var(--band);
        padding: 14px 26px;
      }
      .title {
        font-family: "Playfair Display", serif;
        font-weight: 400;
        font-size: 62px;
        line-height: 1.05;
        color: var(--ink);
        margin: 0;
      }
      .caption {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 30px;
        color: var(--ink-soft);
        margin: 26px 0 0 6px;
        max-width: 820px;
      }

      /* Vignette — corners to ~0.6 alpha */
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          130% 110% at 50% 46%,
          rgba(0, 0, 0, 0) 52%,
          rgba(0, 0, 0, 0.32) 82%,
          rgba(0, 0, 0, 0.60) 100%
        );
      }

      /* Film grain — deterministic SVG feTurbulence (fixed seed), soft-light */
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: soft-light;
        opacity: 0.08;
      }
      .grain svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div data-hf-id="hf-59ke" id="root" data-composition-id="s05-1907" data-start="0" data-width="1920" data-height="1080" data-duration="18" data-fps="30">

      <!-- ============ SCENE 05 — 1907 · Queens of the Atlantic ============ -->
      <section data-hf-id="hf-gjvk" id="s05" class="scene clip" data-start="0" data-duration="18" data-track-index="1">
        <div data-hf-id="hf-4aao" class="photo-frame"><img data-hf-id="hf-0w1i" class="photo" data-layout-allow-overflow="" id="s05-photo" src="assets/s05_1907_mauretania.jpg" alt=""></div>
        <div data-hf-id="hf-jezh" class="grade"></div>
        <div data-hf-id="hf-ul1t" class="text" id="s05-text">
          <p data-hf-id="hf-mtbx" class="kicker">№ 05 · Est. 1907</p>
          <h2 data-hf-id="hf-hhor" class="year">1907</h2>
          <div data-hf-id="hf-b4li" class="year-rule"></div>
          <div data-hf-id="hf-wsha" class="title-band"><h3 data-hf-id="hf-bg0j" class="title">Queens of the Atlantic</h3></div>
          <p data-hf-id="hf-dmhz" class="caption">Four and a half days to cross an ocean.</p>
        </div>
      </section>

      <!-- Persistent overlays -->
      <div data-hf-id="hf-602t" id="ov-vignette" class="vignette clip" data-start="0" data-duration="18" data-track-index="8"></div>
      <div data-hf-id="hf-0a2i" id="ov-grain" class="grain clip" data-start="0" data-duration="18" data-track-index="9">
        <svg data-hf-id="hf-ztyk" xmlns="http://www.w3.org/2000/svg">
          <filter data-hf-id="hf-3qt8" id="grain-f">
            <feturbulence data-hf-id="hf-vpqi" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" />
            <fecolormatrix data-hf-id="hf-skw8" type="saturate" values="0" />
          </filter>
          <rect data-hf-id="hf-loo9" width="100%" height="100%" filter="url(#grain-f)" />
        </svg>
      </div>
    </div>

    <script>
      // ===== ONE paused GSAP timeline, registered under the composition id =====
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ken Burns per DESIGN.md, S05 storyboard: strong horizontal drift LEFT
      // (dir -1, same values as the main film's scene table: scale 1.0 → 1.12,
      // photo xPercent 0 → -3.6; text parallaxes at ~30% of the photo's travel).
      tl.fromTo(
        "#s05-photo",
        { scale: 1.0, xPercent: 0, yPercent: 0 },
        { scale: 1.12, xPercent: -3.6, yPercent: -1.6, duration: 18, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        "#s05-text",
        { xPercent: 0 },
        { xPercent: -3.6 * 0.3, duration: 18, ease: "sine.inOut" },
        0
      );

      // Text entrance choreography (DESIGN.md): YEAR first, TITLE +0.12s, CAPTION +0.28s
      function rise(sel, at, dur, ease, dy) {
        tl.fromTo(sel, { y: dy, opacity: 0 }, { y: 0, opacity: 1, duration: dur, ease }, at);
      }
      const at = 0.4;
      rise("#s05-text .kicker", at - 0.05, 0.7, "power3.out", 30);
      rise("#s05-text .year", at, 0.7, "power3.out", 40);
      rise("#s05-text .year-rule", at + 0.18, 0.55, "power2.out", 14);
      rise("#s05-text .title-band", at + 0.12, 0.7, "power3.out", 36);
      rise("#s05-text .caption", at + 0.28, 0.7, "power2.out", 24);

      window.__timelines["s05-1907"] = tl;
    </script>
  </body>
</html>
