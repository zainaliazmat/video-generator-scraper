<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emergency Fund — Thumbnails</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d1017;
        --ink: #f5f3ec;
        --muted: #98a2b3;
        --fund: #22c55e;
        --warn: #ef4444;
        --pop: #ff5c39;
        --font: "Arial Black", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
        --font-dev: "Noto Sans Devanagari", "Arial Black", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #000; }
      #root { font-family: var(--font); }

      .thumb {
        position: absolute; inset: 0; overflow: hidden;
        background: var(--bg); color: var(--ink);
        display: flex; align-items: center; padding: 0 64px;
      }
      .bg {
        position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center right;
        filter: grayscale(0.3) brightness(0.62) contrast(1.06);
      }
      /* dark on the text side, photo breathes on the right */
      .scrim {
        position: absolute; inset: 0; z-index: 1;
        background:
          linear-gradient(90deg, rgba(13,16,23,0.96) 0%, rgba(13,16,23,0.88) 42%, rgba(13,16,23,0.30) 78%, rgba(13,16,23,0.15) 100%),
          radial-gradient(ellipse 80% 90% at 30% 50%, rgba(239,68,68,0.20), transparent 70%),
          linear-gradient(180deg, rgba(13,16,23,0.35), transparent 40%, rgba(13,16,23,0.55));
      }
      .grain {
        position: absolute; inset: 0; z-index: 1; opacity: 0.06; mix-blend-mode: overlay;
        background-image: url(assets/img/grain.png); background-size: cover;
      }
      .inner { position: relative; z-index: 2; width: 74%; }

      .tag {
        display: inline-block; font-size: 30px; font-weight: 900; letter-spacing: 3px;
        text-transform: uppercase; padding: 10px 22px; border-radius: 999px;
        background: var(--fund); color: #0d1017; margin: 0 0 26px 0;
      }
      .line {
        font-size: 116px; line-height: 0.96; font-weight: 900; margin: 0; letter-spacing: -2px;
        text-shadow: 0 4px 30px rgba(0,0,0,0.85), 0 2px 6px rgba(0,0,0,0.7);
      }
      .line.red { color: var(--warn); }
      .sub {
        margin: 26px 0 0 0; font-size: 34px; font-weight: 900; letter-spacing: 1px; color: var(--ink);
        text-shadow: 0 2px 16px rgba(0,0,0,0.85);
      }
      .sub .amt { color: var(--fund); }
      .dev { font-family: var(--font-dev); letter-spacing: 0; }
      .dev.line { font-size: 104px; line-height: 1.12; }
      .dev.tag { letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="4"
         style="position: relative; width: 1280px; height: 720px; overflow: hidden;">

      <!-- ENGLISH THUMBNAIL -->
      <section id="tEn" class="thumb clip" data-start="0" data-duration="2" data-track-index="1">
        <!-- the car shot is darker than the bike shot it replaced — lift it so the photo side reads -->
        <div class="bg" style="background-image: url(assets/img/s1-car.jpg); filter: grayscale(0.3) brightness(0.95) contrast(1.06)"></div>
        <div class="scrim"></div>
        <div class="grain"></div>
        <div class="inner">
          <p class="tag">Emergency Fund</p>
          <h1 class="line">ONE REPAIR</h1>
          <h1 class="line red">FROM BROKE</h1>
          <p class="sub">Fix it with <span class="amt">$50</span> a week</p>
        </div>
      </section>

      <!-- HINDI / HARYANVI THUMBNAIL -->
      <section id="tHi" class="thumb clip" data-start="2" data-duration="2" data-track-index="1">
        <div class="bg" style="background-image: url(assets/img/s1-bike.jpg)"></div>
        <div class="scrim"></div>
        <div class="grain"></div>
        <div class="inner">
          <p class="tag dev">इमरजेंसी फंड</p>
          <h1 class="line dev">एक झटका</h1>
          <h1 class="line dev red">अर तू कंगाल</h1>
          <p class="sub dev">हफ्ते के <span class="amt">₹2,500</span> — बस इतना ए</p>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
